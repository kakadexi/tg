<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>卡卡的西 · 免费TG代理集群</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgblue: '#0088cc',
                    }
                }
            }
        }
    </script>
    <style>
        :root { --transition-speed: 0.3s; }
        body { 
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* 背景光晕 */
        .bg-glow {
            position: fixed; 
            width: 600px; 
            height: 600px;
            background: radial-gradient(circle, rgba(0, 136, 204, 0.2) 0%, transparent 70%);
            border-radius: 50%; 
            filter: blur(80px); 
            z-index: 0;
            animation: floatGlow 18s infinite alternate;
            pointer-events: none;
            opacity: 0.6;
        }
        @keyframes floatGlow {
            0% { transform: translate(-20%, -20%) scale(1); opacity: 0.4; }
            100% { transform: translate(30%, 30%) scale(1.2); opacity: 0.8; }
        }
        
        /* 玻璃卡片 */
        .glass-card {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1), 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        .dark .glass-card {
            background: rgba(15, 25, 35, 0.55);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* 代理卡片悬浮 */
        .proxy-node {
            transition: all 0.25s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .dark .proxy-node {
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.25);
        }
        .proxy-node:hover {
            transform: translateY(-2px);
            background: rgba(0, 136, 204, 0.08);
            border-color: rgba(0, 136, 204, 0.3);
            box-shadow: 0 8px 20px -8px rgba(0, 136, 204, 0.2);
        }
        
        /* 渐变标题 */
        .glow-name {
            background: linear-gradient(135deg, #3b82f6, #5c6f8f, #7e8aa2, #4f6f8f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
            filter: drop-shadow(0 0 6px rgba(59,130,246,0.5)) drop-shadow(0 0 12px rgba(100,116,139,0.3));
            animation: shimmer 5s ease infinite;
            font-weight: 800;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 5px rgba(59,130,246,0.4)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 12px rgba(56,189,248,0.6)); }
            100% { background-position: 0% 50%; filter: drop-shadow(0 0 5px rgba(59,130,246,0.4)); }
        }
        
        /* 简约toast */
        #toast {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        
        /* 编辑浮层 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .edit-modal {
            width: 90%;
            max-width: 680px;
            max-height: 85vh;
            background: rgba(30, 35, 48, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 40px -12px black;
            overflow: hidden;
        }
        .dark .edit-modal {
            background: rgba(15, 20, 30, 0.95);
        }
        .edit-modal textarea {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .edit-modal textarea:focus {
            outline: none;
            border-color: #0088cc;
        }
        .btn-icon {
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-icon:hover {
            transform: scale(1.05);
            opacity: 0.8;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center py-8 px-5 relative">

    <div class="bg-glow"></div>

    <!-- 主题切换按钮 -->
    <button id="theme-toggle" onclick="toggleTheme()" class="fixed top-5 right-5 z-50 w-11 h-11 rounded-full bg-white/60 dark:bg-black/30 backdrop-blur-sm border border-slate-200/60 dark:border-white/15 flex items-center justify-center shadow-md">
        <i class="fas fa-sun text-amber-400 text-lg hidden dark:block"></i>
        <i class="fas fa-moon text-slate-500 text-lg dark:hidden"></i>
    </button>

    <div class="relative z-10 w-full max-w-xl">
        <!-- 头部标识 + 渐变标题（无英文） -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-4 rounded-3xl bg-white/30 dark:bg-white/5 backdrop-blur-sm mb-5 ring-1 ring-white/40 dark:ring-white/10 shadow-md">
                <i class="fab fa-telegram-plane text-4xl text-tgblue drop-shadow-md"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight flex flex-wrap justify-center gap-x-2 gap-y-1 items-baseline">
                <span class="text-3xl md:text-4xl">✨</span>
                <span class="glow-name text-4xl md:text-5xl">卡卡的西</span>
                <span class="text-3xl md:text-4xl">✨</span>
                <span class="text-base sm:text-lg font-semibold text-slate-500 dark:text-slate-300 ml-1">免费TG代理</span>
            </h1>
        </div>

        <!-- 玻璃卡片 -->
        <div class="glass-card rounded-[2.5rem] p-5 md:p-7 border border-white/40 dark:border-white/5 shadow-2xl">
            <!-- 状态栏：左侧一键直连，右侧集群状态+编辑按钮 -->
            <div class="flex items-center justify-between mb-6 px-1">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">⚡ 一键直连</span>
                </div>
                <div class="text-right flex items-center gap-2">
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase tracking-wider font-medium">集群状态</p>
                        <p class="font-black text-tgblue text-xs tracking-wide"><span id="proxyCount">0</span> 条在线</p>
                    </div>
                    <!-- 编辑按钮（铅笔） -->
                    <button id="openEditBtn" class="w-7 h-7 rounded-full bg-white/30 dark:bg-black/30 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-tgblue/20 transition-all" title="编辑代理列表">
                        <i class="fas fa-pen text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- 动态代理列表容器 -->
            <div class="space-y-3" id="proxy-list"></div>

            <!-- 简约脚标 -->
            <div class="mt-8 pt-5 text-center opacity-40 text-[10px] font-mono tracking-wider text-slate-400 dark:text-slate-500 border-t border-slate-200/30 dark:border-white/5">
                SOCKS5 · 即时加密隧道
            </div>
        </div>
    </div>

    <!-- 编辑浮层 Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="edit-modal p-5 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fas fa-edit text-tgblue"></i> 编辑代理列表</h3>
                <button id="closeModalBtn" class="text-white/70 hover:text-white text-xl">&times;</button>
            </div>
            <p class="text-xs text-slate-300 mb-3">每行一个 <code class="bg-black/30 px-1 rounded">tg://socks?server=IP&amp;port=端口...</code> 格式链接，支持自定义修改或添加新节点。</p>
            <textarea id="proxyEditor" rows="12" class="w-full rounded-xl p-3 resize-y font-mono text-sm" placeholder="粘贴代理链接，每行一条"></textarea>
            <div class="flex justify-end gap-3 mt-5">
                <button id="resetDefaultBtn" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-sm transition">重置默认</button>
                <button id="saveProxyBtn" class="px-5 py-2 rounded-xl bg-tgblue hover:bg-tgblue/80 text-white font-bold shadow-lg transition">保存并应用</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 opacity-0 transition-all duration-300 pointer-events-none translate-y-4 z-[999]">
        <div class="bg-slate-900/90 dark:bg-white/95 backdrop-blur-md text-white dark:text-slate-900 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2 font-medium text-sm">
            <i class="fas fa-check-circle text-emerald-400 text-base"></i>
            <span>配置已复制，正在唤醒 Telegram</span>
        </div>
    </div>

    <script>
        // ======================= 默认代理列表 (11条) =======================
        const DEFAULT_PROXIES = [
            "tg://socks?server=45.192.200.9&port=5555&user=hanbaocloud&pass=hanbaocloud",
            "tg://socks?server=47.254.240.76&port=5555&user=socks5&pass=socks5",
            "tg://socks?server=47.239.202.242&port=6666&user=6666&pass=6666",
            "tg://socks?server=43.100.106.246&port=2222&user=2222&pass=2222",
            "tg://socks?server=47.83.174.84&port=6666&user=6666&pass=6666",
            "tg://socks?server=47.83.186.60&port=5555&user=5555&pass=5555",
            "tg://socks?server=47.83.8.104&port=6666&user=6666&pass=6666",
            "tg://socks?server=43.100.106.218&port=2222&user=2222&pass=2222",
            "tg://socks?server=47.83.1.61&port=5555&user=5555&pass=5555",
            "tg://socks?server=47.83.174.84&port=6666&user=6666&pass=6666",
            "tg://socks?server=47.83.186.60&port=5555&user=5555&pass=5555"
        ];

        // 当前代理数组 (可变)
        let currentProxies = [...DEFAULT_PROXIES];

        // ---------- 本地存储操作 ----------
        function loadProxiesFromStorage() {
            const stored = localStorage.getItem('kkx_proxies');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        currentProxies = parsed;
                        return true;
                    }
                } catch(e) {}
            }
            currentProxies = [...DEFAULT_PROXIES];
            return false;
        }

        function saveProxiesToStorage() {
            localStorage.setItem('kkx_proxies', JSON.stringify(currentProxies));
        }

        function resetToDefault() {
            currentProxies = [...DEFAULT_PROXIES];
            saveProxiesToStorage();
            renderProxyList();
            updateProxyCountDisplay();
            showToast('已恢复默认代理列表', false);
        }

        // 更新计数显示
        function updateProxyCountDisplay() {
            const countSpan = document.getElementById('proxyCount');
            if (countSpan) {
                countSpan.innerText = currentProxies.length;
            }
        }

        // 渲染代理列表
        function renderProxyList() {
            const container = document.getElementById('proxy-list');
            if (!container) return;
            if (!currentProxies.length) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">暂无代理节点，请点击编辑按钮添加</div>`;
                updateProxyCountDisplay();
                return;
            }
            container.innerHTML = currentProxies.map((url, idx) => {
                // 安全解析 server 和 port
                let server = 'unknown', port = '';
                try {
                    const urlObj = new URL(url);
                    if (urlObj.protocol === 'tg:') {
                        const params = new URLSearchParams(urlObj.search);
                        server = params.get('server') || 'unknown';
                        port = params.get('port') || '';
                    } else {
                        // fallback 简单正则
                        const match = url.match(/server=([^&]+)/);
                        const portMatch = url.match(/port=([^&]+)/);
                        if (match) server = match[1];
                        if (portMatch) port = portMatch[1];
                    }
                } catch(e) {
                    // 正则兜底
                    const sMatch = url.match(/server=([^&]+)/);
                    const pMatch = url.match(/port=([^&]+)/);
                    if (sMatch) server = sMatch[1];
                    if (pMatch) port = pMatch[1];
                }
                return `
                    <div class="proxy-node bg-white/40 dark:bg-black/20 rounded-xl p-3.5 flex items-center justify-between cursor-pointer group transition-all" onclick="connectProxy('${escapeHtml(url)}')">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="text-[9px] font-bold text-slate-400 dark:text-slate-500 bg-slate-200/40 dark:bg-white/5 px-2 py-0.5 rounded-full">NODE ${String(idx+1).padStart(2,'0')}</span>
                                <span class="text-[9px] uppercase text-emerald-500/70 font-mono">active</span>
                            </div>
                            <p class="text-sm font-mono font-semibold truncate mt-1 text-slate-700 dark:text-slate-200">${escapeHtml(server)}:${escapeHtml(port)}</p>
                        </div>
                        <div class="w-9 h-9 rounded-xl bg-tgblue/90 dark:bg-tgblue/80 text-white flex items-center justify-center shadow-md transition-transform group-hover:scale-105">
                            <i class="fas fa-bolt text-xs"></i>
                        </div>
                    </div>
                `;
            }).join('');
            updateProxyCountDisplay();
        }

        // 简单防XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }

        // 连接代理 (复制+跳转)
        window.connectProxy = function(url) {
            if (!url || !url.startsWith('tg://')) {
                showToast('链接格式无效，无法跳转', true);
                return;
            }
            navigator.clipboard.writeText(url).catch(() => {});
            const toast = document.getElementById('toast');
            if (toast) {
                toast.classList.add('opacity-100', 'translate-y-0');
                setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                }, 800);
            }
            setTimeout(() => {
                window.location.href = url;
            }, 180);
        };

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const span = toast?.querySelector('span');
            const icon = toast?.querySelector('i');
            if (toast && span) {
                span.innerText = msg;
                if (icon) {
                    if (isError) {
                        icon.className = 'fas fa-exclamation-triangle text-amber-400 text-base';
                    } else {
                        icon.className = 'fas fa-check-circle text-emerald-400 text-base';
                    }
                }
                toast.classList.add('opacity-100', 'translate-y-0');
                setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    if (span && !isError) span.innerText = '配置已复制，正在唤醒 Telegram';
                    else if (span && isError) span.innerText = '操作完成';
                }, 1800);
            }
        }

        // 编辑功能: 打开modal并填充当前代理列表
        function openEditor() {
            const textarea = document.getElementById('proxyEditor');
            if (textarea) {
                textarea.value = currentProxies.join('\n');
            }
            const modal = document.getElementById('editModal');
            if (modal) modal.classList.add('active');
        }

        function closeEditor() {
            const modal = document.getElementById('editModal');
            if (modal) modal.classList.remove('active');
        }

        // 保存编辑器内容
        function saveFromEditor() {
            const textarea = document.getElementById('proxyEditor');
            if (!textarea) return;
            let raw = textarea.value;
            let lines = raw.split(/\r?\n/);
            // 过滤空行，去除首尾空格，只保留 tg:// 开头或至少看起来像代理链接
            let newProxies = [];
            for (let line of lines) {
                line = line.trim();
                if (line === "") continue;
                // 基本校验：必须包含 tg://socks 或 tg:// 且不为空
                if (line.startsWith('tg://') || (line.includes('server=') && line.includes('port='))) {
                    newProxies.push(line);
                } else {
                    // 如果格式明显不对，给个小提示但依旧添加？为了避免误删，直接跳过无效行并警告
                    console.warn('无效代理格式忽略:', line);
                    showToast(`忽略无效行: ${line.substring(0, 30)}`, true);
                }
            }
            if (newProxies.length === 0) {
                showToast('至少保留一个有效代理链接', true);
                return;
            }
            currentProxies = newProxies;
            saveProxiesToStorage();
            renderProxyList();
            closeEditor();
            showToast(`已更新 ${currentProxies.length} 条代理`, false);
        }

        // 主题切换
        window.toggleTheme = function() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        };

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }
        }

        // 初始化页面: 加载存储代理、渲染、绑定事件
        function init() {
            loadProxiesFromStorage();
            renderProxyList();
            initTheme();

            // 编辑弹窗绑定
            const openBtn = document.getElementById('openEditBtn');
            const closeBtn = document.getElementById('closeModalBtn');
            const saveBtn = document.getElementById('saveProxyBtn');
            const resetBtn = document.getElementById('resetDefaultBtn');
            const modal = document.getElementById('editModal');

            if (openBtn) openBtn.addEventListener('click', openEditor);
            if (closeBtn) closeBtn.addEventListener('click', closeEditor);
            if (saveBtn) saveBtn.addEventListener('click', saveFromEditor);
            if (resetBtn) resetBtn.addEventListener('click', () => {
                if (confirm('重置将丢失所有修改，恢复默认代理列表。确定吗？')) {
                    resetToDefault();
                    // 同时更新编辑器内内容（如果modal开着就实时刷新textarea）
                    const ta = document.getElementById('proxyEditor');
                    if (ta && modal && modal.classList.contains('active')) {
                        ta.value = DEFAULT_PROXIES.join('\n');
                    }
                }
            });
            // 点击遮罩关闭
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeEditor();
                });
            }
        }

        init();
    </script>
</body>
</html>
