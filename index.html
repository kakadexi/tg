<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡卡的西✨免费TG代理 - 纯净流</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#0088cc',
                            600: '#0074b3',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.01) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.01) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite linear;
        }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen selection:bg-brand-500/20 selection:text-brand-500 antialiased">

    <main class="w-full max-w-3xl mx-auto px-4 py-12">
        
        <header class="flex flex-col sm:flex-row items-center justify-between border-b border-slate-800 pb-6 mb-8 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-brand-500/10 border border-brand-500/20 flex items-center justify-center text-brand-500">
                    <i class="fab fa-telegram-plane text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white select-none">卡卡的西✨免费TG代理</h1>
                    <p class="text-xs text-slate-500 mt-0.5 select-none">纯净去噪模式 · 试验性免密呼叫</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <span class="text-xs px-2.5 py-1 rounded bg-slate-900 border border-slate-800 font-mono text-slate-400" id="statusText">
                    STATUS: SYNCING...
                </span>
                <button id="refreshBtn" class="p-2 bg-slate-900 hover:bg-slate-800 active:scale-95 border border-slate-800 rounded text-slate-400 hover:text-white transition-all">
                    <i class="fas fa-arrows-rotate text-sm"></i>
                </button>
            </div>
        </header>

        <section class="bg-slate-900/40 border border-slate-900 rounded-xl p-4 md:p-6 backdrop-blur-sm">
            <div class="grid grid-cols-1 gap-2.5" id="proxy-list">
                <div class="shimmer h-[62px] rounded border border-slate-900"></div>
                <div class="shimmer h-[62px] rounded border border-slate-900"></div>
                <div class="shimmer h-[62px] rounded border border-slate-900"></div>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-900 flex flex-wrap items-center justify-between gap-3 text-[11px] text-slate-500 font-mono">
                <div class="flex items-center gap-4">
                    <span><i class="fas fa-lock text-emerald-600"></i> NO-CREDENTIALS-MODE</span>
                </div>
                <span>INTERVAL: 20M</span>
            </div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 opacity-0 translate-y-1 transition-all duration-200 pointer-events-none z-50">
        <div class="bg-slate-900 border border-slate-800 text-slate-300 px-4 py-2.5 rounded shadow-xl text-xs font-mono flex items-center gap-2">
            <i class="fas fa-terminal text-brand-500"></i>
            <span id="toast-msg">SUCCESS</span>
        </div>
    </div>

    <script>
        const PROXY_API_URL = 'https://gh-proxy.org/https://raw.githubusercontent.com/watchttvv/free-proxy-list/refs/heads/main/proxy.txt';

        async function fetchProxies() {
            const listContainer = document.getElementById('proxy-list');
            const statusSpan = document.getElementById('statusText');
            
            statusSpan.innerText = 'STATUS: SYNCING...';
            listContainer.innerHTML = Array(4).fill(0).map(() => `<div class="shimmer h-[62px] rounded border border-slate-900"></div>`).join('');
            
            try {
                const response = await fetch(PROXY_API_URL);
                if (!response.ok) throw new Error(`HTTP_${response.status}`);
                const text = await response.text();
                
                const lines = text.split('\n');
                const filteredProxies = [];
                
                for (const line of lines) {
                    const match = line.trim().match(/^(socks5:\/\/[^:\s]+:\d+)/i);
                    if (match) {
                        const rawProxy = match[1];
                        if (!/x/i.test(rawProxy)) {
                            filteredProxies.push(rawProxy);
                        }
                    }
                }
                
                if (filteredProxies.length === 0) throw new Error('NO_MATCHED_NODES');
                
                statusSpan.innerText = `ACTIVE_NODES: ${filteredProxies.length}`;
                renderProxyNodes(filteredProxies);
                
            } catch (error) {
                console.error(error);
                statusSpan.innerText = 'STATUS: FAILED';
                listContainer.innerHTML = `
                    <div class="bg-red-950/10 rounded p-6 text-center border border-red-900/20 font-mono">
                        <p class="text-xs text-red-400">⚡ Fetch Pipe Interrupted</p>
                        <button onclick="fetchProxies()" class="mt-4 text-[11px] bg-slate-900 hover:bg-slate-800 px-3 py-1 rounded border border-slate-800 text-slate-400 transition-colors">RETRY</button>
                    </div>
                `;
            }
        }
        
        // 【核心修改点】：完全移除了 user 和 pass 参数的拼接，仅保留服务器和端口
        function convertToTgLink(socksUrl) {
            const url = socksUrl.replace(/^socks5:\/\//i, '');
            const [hostport] = url.split('?');
            const [server, port] = hostport.split(':');
            
            return `tg://socks?server=${encodeURIComponent(server)}&port=${encodeURIComponent(port)}`;
        }
        
        function renderProxyNodes(proxiesList) {
            const list = document.getElementById('proxy-list');
            
            list.innerHTML = proxiesList.map((socksUrl, idx) => {
                const serverMatch = socksUrl.match(/\/\/([^:]+):(\d+)/);
                const serverIp = serverMatch ? serverMatch[1] : 'Unknown';
                const port = serverMatch ? serverMatch[2] : '80';
                const tgLink = convertToTgLink(socksUrl);
                
                return `
                    <div class="group bg-slate-900/30 hover:bg-slate-900/80 border border-slate-900 hover:border-slate-800 rounded p-3 flex items-center justify-between transition-all font-mono">
                        <div class="min-w-0 pr-2">
                            <div class="flex items-center gap-2 text-[10px] text-slate-500">
                                <span class="text-brand-500 font-bold">#${String(idx + 1).padStart(2, '0')}</span>
                                <span>SOCKS5</span>
                                <span>•</span>
                                <span>PORT:${port}</span>
                            </div>
                            <p class="text-sm font-bold text-slate-300 mt-0.5 truncate select-all" title="${serverIp}">${serverIp}</p>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button onclick="copyRawLink(event, '${tgLink}')" class="p-2 text-slate-500 hover:text-slate-300 bg-slate-950/40 hover:bg-slate-900 rounded border border-transparent hover:border-slate-800 transition-all">
                                <i class="far fa-copy text-xs"></i>
                            </button>
                            <button onclick="connectProxy('${tgLink.replace(/'/g, "\\'")}')" class="px-3 py-1.5 text-xs bg-brand-500 hover:bg-brand-600 text-white font-bold rounded transition-all active:scale-95">
                                CONNECT
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-1');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-1');
            }, 1500);
        }

        function copyRawLink(event, link) {
            event.stopPropagation();
            navigator.clipboard.writeText(link);
            showToast('CLIPBOARD_COPIED');
        }
        
        function connectProxy(tgUrl) {
            navigator.clipboard.writeText(tgUrl);
            showToast('CLEAN_CONFIG_CALLING_TG');
            setTimeout(() => {
                window.location.href = tgUrl;
            }, 300);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            fetchProxies();
            document.getElementById('refreshBtn').addEventListener('click', fetchProxies);
        });
    </script>
</body>
</html>
